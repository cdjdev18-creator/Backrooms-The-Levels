<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backrooms The Levels</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#1b1b1b;
    text-align:center;
    padding:40px;
}

header h1{
    color:#ffd700;
    font-size:50px;
}

header p{
    color:#ccc;
    font-size:22px;
}

#contenido{
    max-width:1000px;
    margin:auto;
    padding:40px;
}

.markdown-body{
    background:#1a1a1a;
    color:white;
    padding:40px;
    border-radius:15px;
}

</style>

</head>
<body>

<header>

<h1>Backrooms The Levels</h1>

<p>Explora. Sobrevive. Descubre nuevos niveles.</p>

</header>

<div id="contenido">

<div id="readme" class="markdown-body">
Cargando...
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

fetch("README.md")
.then(r=>r.text())
.then(md=>{

document.getElementById("readme").innerHTML=marked.parse(md);

});

</script>

</body>
</html>
